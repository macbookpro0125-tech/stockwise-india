# Render Blueprint — the whole app as one web service with a persistent disk.
# In Render: New -> Blueprint -> pick this repository, Blueprint Path:
# render-paid.yaml, then approve. (render.yaml is the free test copy.)
#
# The disk holds the accounts database (with 14 days of daily copies in
# backups/) and the market data, so a redeploy keeps them — about 120 MB
# today, growing ~150 MB a year with daily prices. Disks need a paid instance
# (Starter: 512 MB of memory; the app peaks near 250 MB with the whole market
# loaded). The market data comes from the evening refresh workflow's
# data-latest release (DATA_JOBS=pull, 17 Oct 2026): installed within a minute
# of the first start rather than a ~2-hour fetch from NSE, checked every half
# hour after, and only one thing (the workflow) ever fetches from NSE. Price
# alerts, Telegram and the daily backups run on this server. Singapore is
# Render's region nearest India.
#
# The settings marked sync: false are secrets or yours to choose — Render asks
# for them when the Blueprint is created, and they never go in this repository.
services:
  - type: web
    # not "stockwise-india": that's the free copy's name, and the two run side
    # by side until the domain moves here
    name: stockwise-india-live
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: DATA_DIR
        value: /var/data
      # the evening's data from GitHub; alerts, Telegram and backups here
      # (server/http-server.js)
      - key: DATA_JOBS
        value: pull
      # Render's proxy sits in front: the login limits read the visitor's
      # address from it (server/rate-limit.js)
      - key: TRUST_PROXY
        value: "1"
      # The site's own address, e.g. https://jocularinsights.com — reset emails link to it
      - key: APP_URL
        sync: false
      # Telegram alerts: the key from @BotFather (server/telegram.js). One bot
      # can be polled by one server only — stop the laptop copy, or give it
      # its own bot.
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      # Password-reset email through Resend, from an address on the verified
      # domain, e.g. "Jocular Insights <no-reply@jocularinsights.com>" (server/email.js)
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      # Sign-in with Google / Apple / phone (server/firebase-auth.js): the
      # Firebase web app's config — public values, but this site's own.
      # FIREBASE_PROVIDERS lists the buttons: google for now — phone needs
      # Firebase's pay-as-you-go plan before it can send texts (add phone then,
      # and apple once Sign in with Apple is set up).
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_API_KEY
        sync: false
      - key: FIREBASE_APP_ID
        sync: false
      - key: FIREBASE_PROVIDERS
        value: google
    disk:
      name: stockwise-data
      mountPath: /var/data
      sizeGB: 1
