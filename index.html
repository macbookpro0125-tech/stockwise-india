<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- viewport-fit=cover: the page may run under the notch and home bar,
       and index.css pads what matters with env(safe-area-inset-*);
       resizes-content: the keyboard shrinks the page on Android as on iOS -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
  <title>Jocular Insights — Indian stock market screener and fair values (NSE)</title>
  <meta name="description" content="Indian stock market research: screen every NSE-listed company with ready-made strategies, see a quality score out of 100 from each company's own filings, with every check explained, and a fair value from its own history. Free during early access." />
  <!-- Link previews (WhatsApp, Telegram, X): the default card; pages the
       server writes (seo.js) add their own title, description and address -->
  <meta property="og:site_name" content="Jocular Insights" />
  <meta property="og:image" content="https://jocularinsights.in/og/default.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Jocular Insights: every NSE company, scored on its own filings" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="google-site-verification" content="KuXXz7_1Z70ZT7qL4u6IAAlXTaYKCNcMXwyDji72OQQ" />
  <!-- The dark theme's page colour; App.jsx switches it with the theme -->
  <meta name="theme-color" content="#080810" />
  <!-- The white JI (27 Oct 2026, "I want the white logo there"): square PNGs
       in 48px steps, as Google's search results want, and /favicon.ico. Since
       31 Oct the small sizes (16 to 48) are the JI and its swept ring drawn
       solid in the logo's own silver and charcoal: the artwork's thin silver
       lines faded to grey dots in a browser tab. 96 and up stay close to it -->
  <link rel="icon" href="/favicon-16.png" sizes="16x16" type="image/png" />
  <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
  <link rel="icon" href="/favicon-48.png" sizes="48x48" type="image/png" />
  <link rel="icon" href="/favicon-96.png" sizes="96x96" type="image/png" />
  <link rel="icon" href="/favicon-192.png" sizes="192x192" type="image/png" />
  <link rel="shortcut icon" href="/favicon.ico" />
  <!-- Installable as an app: the manifest for Android and desktop, and the
       tags an iPhone reads when it's added to the home screen (a PNG: iOS
       ignores an SVG icon) -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="Jocular" />
  <!-- The website's AdSense account (26 Oct 2026): Google reads this to
       verify the site is ours. Ads themselves load only when the server's
       WEB_ADS switch is on (src/ads.jsx), and never in the app -->
  <!-- the opening's tile (Intro.jsx), fetched with the page so it's there the moment it shows -->
  <link rel="preload" as="image" href="/jocular-insights-mark.svg" />
  <meta name="google-adsense-account" content="ca-pub-4001463380481442" />
  <!-- In the Android or iPhone app, the page the server writes for search
       engines (seo.js: a heading and paragraphs) stays unseen until the app
       has drawn itself: it flashed up for a moment at every start (26 Oct
       2026). main.jsx adds app-drawn after the first draw. A browser too, since
       31 Oct 2026 ("I see this page whenever I move from one page to another
       or open the app": a reload showed it for half a second before the app).
       If the app hasn't started 4 s on, it shows after all; without script
       (the noscript below) it shows at once, for a search engine or a visitor
       who reads it. A load that takes a moment shows a small spinner. -->
  <style>
    html:not(.app-drawn) #root { visibility: hidden; animation: root-show 0s linear 4s forwards; }
    html.in-app:not(.app-drawn) #root { animation: none; }
    @keyframes root-show { to { visibility: visible; } }
    html:not(.app-drawn) body::after { content: ""; position: fixed; left: 50%; top: 45%; width: 26px; height: 26px; margin: -13px 0 0 -13px; border-radius: 50%; border: 2.5px solid rgba(127, 127, 127, 0.18); border-top-color: #00E0BE; opacity: 0; animation: boot-spin 0.8s linear infinite, boot-fade 0.2s ease-out 0.35s forwards; }
    @keyframes boot-spin { to { transform: rotate(360deg); } }
    @keyframes boot-fade { to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { html:not(.app-drawn) body::after { animation: boot-fade 0.2s ease-out 0.35s forwards; } }
  </style>
  <noscript><style>html:not(.app-drawn) #root { visibility: visible; animation: none; } html:not(.app-drawn) body::after { display: none; }</style></noscript>
  <script>
    (function () {
      var ua = navigator.userAgent || "";
      if (/; wv\)/.test(ua) || window.Capacitor) document.documentElement.classList.add("in-app");
    })();
  </script>
</head>
<body>
  <!-- Under the status bar in the Android app (index.css .safe-top), on
       every page; nothing in a browser -->
  <div class="safe-top" aria-hidden="true"></div>
  <div id="root"></div>
  <!-- A phone whose browser engine is too old for the app (24 Oct 2026: a
       tester's Xiaomi showed only a black screen — the app's code needs about
       Chrome 111, and some phones never update Android System WebView). Plain,
       old JavaScript, so it runs anywhere: if the engine lacks what the app
       uses, or the app hasn't started 12 seconds on, it says why and how to
       fix it, instead of a black screen. main.jsx removes it once started. -->
  <script>
    (function () {
      var ua = navigator.userAgent || "";
      var inApp = /; wv\)/.test(ua) || /Android.*Version\/\d/.test(ua);
      var old = !(window.CSS && CSS.supports && CSS.supports("color", "color-mix(in srgb, red, blue)")) || !Array.prototype.at || !Object.hasOwn;
      function show(why) {
        if (window.__appStarted || document.getElementById("boot-guard")) return;
        var webview = "https://play.google.com/store/apps/details?id=com.google.android.webview";
        var box = document.createElement("div");
        box.id = "boot-guard";
        box.setAttribute("role", "alert");
        box.style.cssText = "position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;padding:24px;background:#080810;color:#F4F4FF;font:16px/1.5 -apple-system,Roboto,Segoe UI,Arial,sans-serif;text-align:center";
        box.innerHTML = '<div style="max-width:420px">'
          + '<p style="font-size:20px;font-weight:600;margin:0 0 10px">' + (why === "old" ? "This phone's browser engine is out of date" : "Jocular Insights didn't start") + '</p>'
          + '<p style="color:#A8A8C0;margin:0 0 20px">' + (inApp
            ? "The app runs on your phone's <b>Android System WebView</b>. Update it (and Google Chrome) from Google Play, then open the app again."
            : "Please update your browser to its latest version, or open the site in an up-to-date Chrome, Safari, Edge or Firefox.") + '</p>'
          + (inApp ? '<p style="margin:0 0 12px"><a href="' + webview + '" style="display:inline-block;background:#00E0BE;color:#04201b;font-weight:600;padding:12px 20px;border-radius:12px;text-decoration:none">Update Android System WebView</a></p>' : '')
          + '<p style="margin:0"><a href="javascript:location.reload()" style="color:#00E0BE">Try again</a></p></div>';
        document.body.appendChild(box);
      }
      // only if the app really hasn't started: sooner on an engine that lacks
      // what it uses, but never in the way of one that manages anyway
      setTimeout(function () { show(old ? "old" : "stuck"); }, old ? 3000 : 12000);
    })();
  </script>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
