    <h1>You're offline</h1>
    <p>Jocular Insights needs the internet for prices and filings. It will reconnect by itself.</p>
    <button type="button" id="retry">Try again</button>
    <span class="status" id="status" role="status"></span>
  </main>
  <script>
    // Only ever back to a web address (the app sets it)
    var to = new URLSearchParams(location.search).get("to") || "";
    if (!/^https?:\/\/[^\s]+$/.test(to)) to = "";
    var status = document.getElementById("status");
    function go() { if (to) location.replace(to); }
    // Reachable? An opaque answer is enough: any reply means the network is back
    function check() {
      if (!to || !navigator.onLine) return;
      fetch(to.replace(/\/$/, "") + "/api/health", { mode: "no-cors", cache: "no-store" }).then(go, function () {});
    }
    document.getElementById("retry").addEventListener("click", function () {
      status.textContent = "Connecting…";
      go();
    });
    window.addEventListener("online", check);
    setInterval(check, 5000);
  </script>
</body>
