name: Evening data refresh

# First run at 16:30 IST on weekdays, after the market closes. NSE's final
# price file can arrive later, so retry at 20:00 IST; publish the result as
# the `data-latest` release. Render checks for it every five minutes
# (server/data-pull.js).
#
# The release has to be downloadable without signing in, so this relies on
# the repository being public; a private one needs the server to send a token.
on:
  schedule:
    - cron: "0 11 * * 1-5" # 16:30 IST, Monday to Friday
    # Retry at 20:00 IST only if the 16:30 run still has an older price date.
    - cron: "30 14 * * 1-5"
    # A second-chance retry at 07:00 IST next morning, for failures or delays.
    - cron: "30 1 * * 2-6"
  workflow_dispatch:
  # A change to how the refresh runs is tried straight away
  push:
    branches: [main]
    paths:
      - .github/workflows/data-refresh.yml
      - scripts/refresh-data.mjs
      - package.json
      - seed/market-data.tar.gz

permissions:
  contents: write # to update the data-latest release

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --omit=dev

      # A year of NSE's daily price files (52-week range, returns, technicals),
      # kept between runs rather than downloaded again (~100 MB)
      - uses: actions/cache/restore@v4
        with:
          path: data/prices
          key: prices-${{ github.run_id }}
          restore-keys: prices-

      # The last published data, or the repository's seed when that was built
      # later (a fetch run on a computer and committed) — whichever is newer
      - name: Start from the newest data
        id: start_data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data /tmp/pack /tmp/release /tmp/seed
          tar -xzf seed/market-data.tar.gz -C /tmp/seed
          if gh release download data-latest --pattern market-data.tar.gz --dir /tmp/pack; then
            tar -xzf /tmp/pack/market-data.tar.gz -C /tmp/release
            # When results were last checked, so the next check starts there
            gh release download data-latest --pattern jobs-state.json --dir /tmp/release || true
          fi
          from=$(node -e 'const fs = require("fs"); const built = d => { try { return Date.parse(JSON.parse(fs.readFileSync(`/tmp/${d}/market-snapshot.json`, "utf8")).builtAt) || 0; } catch { return 0; } }; console.log(built("release") >= built("seed") ? "release" : "seed")')
          cp -R /tmp/$from/. data/
          # A newer release may predate the logo cache in the seed. Add its
          # validated company icons without replacing logos from the release.
          logos_added=0
          if [ -d /tmp/seed/logos ]; then
            logos_added=$(node --input-type=module -e 'import { mergeLogoCache } from "./server/data-pull.js"; console.log(mergeLogoCache("/tmp/seed/logos", "data/logos"))')
          fi
          # Older release packs don't have the frozen score study. Keep it
          # from the seed until the next pack is published with this entry.
          if [ ! -f data/research-score-cohorts.json ] && [ -f /tmp/seed/research-score-cohorts.json ]; then
            cp /tmp/seed/research-score-cohorts.json data/research-score-cohorts.json
          fi
          if [ -f /tmp/release/research-score-cohorts.json ] && [ -d /tmp/release/logos ]; then force_pack=false; else force_pack=true; fi
          if [ "$logos_added" -gt 0 ]; then
            force_pack=true
            echo "The seed adds $logos_added validated company logos to the release."
          fi
          echo "force_pack=$force_pack" >> "$GITHUB_OUTPUT"
          prices_date=$(node -e 'const fs = require("fs"); try { console.log(JSON.parse(fs.readFileSync("data/market-snapshot.json", "utf8")).pricesDate || ""); } catch { console.log(""); }')
          echo "prices_date=$prices_date" >> "$GITHUB_OUTPUT"
          # The Explore page's indices (23 Oct 2026) come with a rebuild; a
          # snapshot built before them has none
          has_board=$(node -e 'const fs = require("fs"); try { console.log(JSON.parse(fs.readFileSync("data/market-snapshot.json", "utf8")).indexBoard ? "true" : "false"); } catch { console.log("false"); }')
          echo "has_board=$has_board" >> "$GITHUB_OUTPUT"
          # NSE posts its daily index file a little after the price file: a
          # run in between builds the day's prices with no index closes
          indices_current=$(node -e 'const fs = require("fs"); try { const s = JSON.parse(fs.readFileSync("data/market-snapshot.json", "utf8")); const days = s.indexBoard?.days ?? []; console.log(s.indices?.length && days[days.length - 1] === s.pricesDate ? "true" : "false"); } catch { console.log("false"); }')
          echo "indices_current=$indices_current" >> "$GITHUB_OUTPUT"
          echo "Started from the $from data"

      - name: Decide whether to rebuild though the snapshot is recent
        id: retry
        env:
          SCHEDULE: ${{ github.event.schedule }}
          PRICES_DATE: ${{ steps.start_data.outputs.prices_date }}
          HAS_BOARD: ${{ steps.start_data.outputs.has_board }}
          INDICES_CURRENT: ${{ steps.start_data.outputs.indices_current }}
        run: |
          today_ist=$(node -e 'console.log(new Date(Date.now() + 330 * 60 * 1000).toISOString().slice(0, 10))')
          force=false
          # The evening runs (16:30 and 20:00) rebuild whenever today's close
          # isn't in yet — not only when the last build is 18 hours old: a
          # build that finished after midnight made the 16:30 run skip
          if { [ "$SCHEDULE" = "0 11 * * 1-5" ] || [ "$SCHEDULE" = "30 14 * * 1-5" ]; } && [ "$PRICES_DATE" != "$today_ist" ]; then
            force=true
            echo "Today's NSE close is not in the published snapshot; refreshing."
          elif [ "$HAS_BOARD" != "true" ]; then
            force=true
            echo "The published snapshot predates the Explore page's indices; rebuilding."
          elif [ "$INDICES_CURRENT" != "true" ]; then
            force=true
            echo "The snapshot's index closes are behind its prices (NSE's index file came later); rebuilding."
          else
            echo "The published snapshot is current; no rebuild needed."
          fi
          echo "force_data_refresh=$force" >> "$GITHUB_OUTPUT"

      - name: Refresh from NSE
        id: refresh
        env:
          FORCE_DATA_PACK: ${{ steps.start_data.outputs.force_pack }}
          FORCE_DATA_REFRESH: ${{ steps.retry.outputs.force_data_refresh }}
          # The price history back five years, 120 more trading days a run
          # (server/history-backfill.js), gently, until it's there
          HISTORY_YEARS: "5"
          HISTORY_BACKFILL_DAYS: "120"
          # The statements in detail and sales by segment (fetch-nse.js
          # DETAIL_VERSION): 300 companies re-read a run, biggest first
          DETAIL_BATCH: "300"
        run: node --no-warnings scripts/refresh-data.mjs

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: data/prices
          key: prices-${{ github.run_id }}

      - name: Publish
        if: steps.refresh.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # history: each company's daily prices from NSE (price-history.js), once there are any
          tar -czf market-data.tar.gz -C data market logos market-snapshot.json performance-snapshots.json research-score-cohorts.json shareholding $( [ -d data/history ] && echo history )
          node -e 'const fs = require("fs"); const s = JSON.parse(fs.readFileSync("data/market-snapshot.json", "utf8")); console.log(JSON.stringify({ builtAt: s.builtAt, pricesDate: s.pricesDate, companies: fs.readdirSync("data/market").length, packedAt: new Date().toISOString() }))' > manifest.json
          cat manifest.json
          cp data/jobs-state.json jobs-state.json 2>/dev/null || echo '{}' > jobs-state.json
          gh release view data-latest > /dev/null 2>&1 || gh release create data-latest --prerelease --title "Latest market data" --notes "Replaced every weekday evening by the Evening data refresh workflow. The live free copy pulls market-data.tar.gz from here (server/data-pull.js)."
          # The pack before the manifest, so a server never sees a manifest
          # newer than the pack beside it
          gh release upload data-latest market-data.tar.gz jobs-state.json --clobber
          gh release upload data-latest manifest.json --clobber
