# Render Blueprint for a FREE test copy — no card needed. The real launch uses
# render-paid.yaml (Starter instance + disk). This one is render.yaml because
# Render's Blueprint form reads render.yaml first, and a paid one there makes
# it demand a card before the path can be changed.
#
# A free instance has no disk and sleeps after 15 minutes without visitors,
# losing everything it wrote. So this copy doesn't fetch from NSE
# (DATA_JOBS=off: no data jobs, Telegram, alert checks or backups) — the build
# unpacks seed/market-data.tar.gz instead: the market snapshot, every
# company's figures and the strategy picks, packed on a machine that ran the
# fetch (`npm run pack:seed`). After that the server keeps itself current:
# every half hour it looks for the data GitHub Actions publishes each weekday
# evening and pulls it in (the data-latest release;
# .github/workflows/data-refresh.yml, server/data-pull.js).
# Accounts, watchlists and alerts last only until the instance next sleeps.
#
# In Render: New -> Blueprint -> Public Git Repository -> this repository's
# URL (the Blueprint Path can stay empty).
services:
  - type: web
    name: stockwise-india
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --include=dev && npm run build && mkdir -p data && tar -xzf seed/market-data.tar.gz -C data
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      # Render's proxy sits in front: the login limits read the visitor's
      # address from it (server/rate-limit.js)
      - key: TRUST_PROXY
        value: "1"
      - key: DATA_JOBS
        value: "off"
